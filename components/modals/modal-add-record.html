            <!-- Add Record Modal Overlay -->
            <div class="modal-overlay" id="add-record-modal">
                <div class="modal-container">
                    <div class="modal-header" style="display: flex; justify-content: flex-start; align-items: center; gap: 12px; padding-right: 48px;">
                        <h2 id="modal-title" style="margin: 0; white-space: nowrap;" data-i18n="ui.record.addTitle">Add Record</h2>
                        <select id="modal-account-select" class="form-control" style="width: auto; padding: 4px 32px 4px 12px; font-weight: bold; color: var(--primary-color); border: 2px solid var(--primary-color); border-radius: 8px; font-size: 1.1rem; background-color: var(--bg-color);">
                            <!-- Options will be populated via JS -->
                        </select>
                        <button class="btn-close" id="btn-close-record-modal" style="position: absolute; right: 16px; top: 16px;">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div id="read-only-notice"
                            style="display: none; padding: 10px 16px; background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; border-radius: 8px; margin-bottom: 16px; font-size: 0.95rem; align-items: center; justify-content: center; gap: 6px;">
                            <span class="material-icons" style="font-size: 18px;">info</span>
                            <span data-i18n="ui.record.fixedGeneratedTip">Details generated by fixed records, for view only</span>
                        </div>
                        <div class="modal-tabs">
                            <button class="modal-tab-btn active" data-type="expense" data-i18n="ui.modals.record.tabExpense">Expense</button>
                            <button class="modal-tab-btn" data-type="income" data-i18n="ui.modals.record.tabIncome">Income</button>
                        </div>
                        <div class="modal-tabs">
                            <button class="modal-tab-btn active" data-mode="single" data-i18n="ui.modals.record.tabSingle">Single</button>
                            <button class="modal-tab-btn" data-mode="fixed" data-i18n="ui.modals.record.tabFixed">Fixed</button>
                        </div>

                        <div class="form-row" style="align-items: center;">
                            <!-- Date Side -->
                            <div style="flex: 1.5;">
                                <div id="date-group-single" class="form-group" style="margin-bottom: 0;">
                                    <div class="form-label" data-i18n="ui.modals.record.date">Date</div>
                                    <input type="date" class="form-control" id="input-date-single" required
                                        style="cursor: pointer;" onclick="this.showPicker()">
                                </div>

                                <div class="date-group-fixed" style="display: none;">
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <div class="form-label" data-i18n="ui.modals.record.dateRange">Date Range</div>
                                        <div style="display: flex; flex-direction: column; gap: 8px;">
                                            <input type="date" class="form-control" id="input-date-start" required
                                                data-i18n-placeholder="ui.modals.record.startDate" style="position: relative; cursor: pointer;"
                                                onclick="this.showPicker()">
                                            <input type="date" class="form-control" id="input-date-end"
                                                data-i18n-placeholder="ui.modals.record.endDate" style="position: relative; cursor: pointer;"
                                                onclick="this.showPicker()">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Amount Side -->
                            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                                <div class="form-label" data-i18n="ui.modals.record.amount">Amount</div>
                                <input type="number" class="form-control" id="input-amount" placeholder="0">
                            </div>
                        </div>

                        <div class="form-row date-group-fixed" style="display: none; margin-top: 1rem;">
                            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                                <div class="form-label" data-i18n="ui.modals.record.repeatType">Repeat Type</div>
                                <div class="modal-tabs">
                                    <button class="modal-tab-btn active" data-rule="yearly" data-i18n="ui.modals.record.ruleYearly">Yearly</button>
                                    <button class="modal-tab-btn" data-rule="monthly" data-i18n="ui.modals.record.ruleMonthly">Monthly</button>
                                    <button class="modal-tab-btn" data-rule="weekly" data-i18n="ui.modals.record.ruleWeekly">Weekly</button>
                                </div>
                            </div>

                            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                                <div class="form-label" data-i18n="ui.modals.record.ruleDetail">Details</div>
                                <!-- Yearly Details -->
                                <div id="rule-detail-yearly" class="rule-detail-group"
                                    style="display: flex; gap: 0.5rem;">
                                    <select class="form-control" id="select-rule-month"></select>
                                    <select class="form-control" id="select-rule-day-yearly"></select>
                                </div>

                                <!-- Monthly Details -->
                                <div id="rule-detail-monthly" class="rule-detail-group" style="display: none;">
                                    <select class="form-control" id="select-rule-day-monthly"></select>
                                </div>

                                <!-- Weekly Details -->
                                <div id="rule-detail-weekly" class="rule-detail-group" style="display: none;">
                                    <select class="form-control" id="select-rule-weekday">
                                        <option value="1" data-i18n="ui.modals.record.monday">Monday</option>
                                        <option value="2" data-i18n="ui.modals.record.tuesday">Tuesday</option>
                                        <option value="3" data-i18n="ui.modals.record.wednesday">Wednesday</option>
                                        <option value="4" data-i18n="ui.modals.record.thursday">Thursday</option>
                                        <option value="5" data-i18n="ui.modals.record.friday">Friday</option>
                                        <option value="6" data-i18n="ui.modals.record.saturday">Saturday</option>
                                        <option value="0" data-i18n="ui.modals.record.sunday">Sunday</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group" style="flex: 1;">
                                <div class="form-label" data-i18n="ui.modals.record.majorCat">Major</div>
                                <select class="form-control" id="select-major-cat"></select>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <div class="form-label" data-i18n="ui.modals.record.subCat">Minor</div>
                                <select class="form-control" id="select-sub-cat"></select>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <div class="form-label" data-i18n="ui.modals.record.target">Target</div>
                                <select class="form-control" id="select-target"></select>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-label" data-i18n="ui.modals.record.location">Location</div>
                            <div style="display: flex; gap: 8px; align-items: stretch;">
                                <div style="position: relative; flex: 1; min-width: 0;">
                                    <!-- Google Maps Web Component Upgrade -->
                                    <style>
                                        /* Fix the white background of the component itself */
                                        gmp-place-autocomplete {
                                            background-color: transparent;
                                            border: none;
                                        }
                                        /* Let internal input inherit Tailwind CSS and our existing appearance */
                                        gmp-place-autocomplete::part(input) {
                                            width: 100%;
                                            padding-right: 36px;
                                            border-radius: 12px;
                                            border: 1px solid var(--border-color);
                                            background-color: var(--surface-color);
                                            color: var(--text-main);
                                            font-size: 1rem;
                                            box-sizing: border-box;
                                            transition: all 0.2s ease;
                                            outline: none;
                                        }
                                        /* Fix search icon color */
                                        gmp-place-autocomplete::part(search-icon) {
                                            fill: var(--text-muted);
                                        }
                                        gmp-place-autocomplete::part(input):focus {
                                            border-color: var(--primary-color);
                                            box-shadow: 0 0 0 3px rgba(6, 81, 237, 0.1);
                                        }
                                    </style>
                                    <gmp-place-autocomplete id="input-location" data-i18n-placeholder="ui.modals.record.locationPlaceholder" style="width: 100%; display: block;" fields="displayName,formattedAddress,name,formatted_address"></gmp-place-autocomplete>
                                    <span class="material-icons" id="btn-clear-location"
                                        style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 18px; padding: 4px; display: none; z-index: 2;">close</span>
                                </div>
                                <button type="button" class="btn btn-outline" id="btn-map-location"
                                    style="width: 48px; height: 48px; padding: 0; flex-shrink: 0; display: flex; align-items: center; justify-content: center;"
                                    data-i18n-title="ui.modals.record.mapTitle">
                                    <span class="material-icons">location_on</span>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-label" data-i18n="ui.modals.record.photo">Photo</div>
                            <div class="photo-upload-box" id="photo-upload-box" style="padding: 1rem;">
                                <div id="photo-placeholder" style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%; position: relative;">
                                    <span class="material-icons" style="font-size: 2rem;">camera_alt</span>
                                    <span data-i18n="ui.modals.record.photoUpload">Take or Upload Photo</span>
                                    <input type="file" id="input-photo" accept="image/*" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
                                </div>
                                <div id="photo-preview-container" style="display: none; position: relative; width: 100%;">
                                    <img id="photo-preview" class="photo-preview" src="" alt="Preview" style="display: block; margin: 0 auto; max-height: 200px; max-width: 100%; border-radius: var(--border-radius); cursor: pointer;" data-i18n-title="ui.modals.record.photoRecrop">
                                    <button type="button" id="btn-delete-photo" class="btn btn-danger" style="position: absolute; top: 4px; right: 4px; padding: 4px; border-radius: 50%; min-width: auto; min-height: auto; line-height: 1; display: flex; align-items: center; justify-content: center;" data-i18n-title="ui.modals.record.photoDelete">
                                        <span class="material-icons" style="font-size: 18px;">close</span>
                                    </button>
                                </div>
                                <canvas id="photo-canvas" style="display: none;"></canvas>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="form-label" data-i18n="ui.modals.record.note">Note</div>
                            <textarea class="form-control" id="input-note" data-i18n-placeholder="ui.modals.record.notePlaceholder" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer" style="justify-content: space-between; display: flex;">
                        <div style="display: flex; gap: 16px;">
                            <button class="btn btn-danger" id="btn-delete-record" style="display:none;" data-i18n="ui.modals.record.btnDelete">Delete</button>
                            <button class="btn btn-secondary" id="btn-copy-record" style="display:none;" data-i18n="ui.modals.record.btnCopy">Copy</button>
                        </div>
                        <div style="display: flex; gap: 16px;">
                            <button class="btn btn-primary" id="btn-save-record" data-i18n="ui.modals.record.btnSave">Save</button>
                            <button class="btn btn-outline" id="btn-cancel-record" data-i18n="ui.modals.record.btnCancel">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
